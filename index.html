<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Senin için hazırlanmış küçük ve romantik bir sürpriz.">
  <meta name="theme-color" content="#FFD6E7">
  <title>Sana küçük bir sorum var ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .muzik-dugmesi {
      position: fixed; right: 16px; bottom: 16px; z-index: 80;
      border: 1px solid rgba(255,79,135,.3); border-radius: 999px;
      padding: 11px 16px; background: rgba(255,255,255,.94);
      color: #54283D; font: 700 .92rem/1.2 inherit; font-family: inherit;
      box-shadow: 0 8px 22px rgba(84,40,61,.18); cursor: pointer;
    }
    .muzik-dugmesi:hover { background: #FFF0F5; }
    .muzik-dugmesi:focus-visible { outline: 3px solid #FF4F87; outline-offset: 3px; }
  </style>
</head>
<body>

  <div class="arka-plan" id="arkaPlan" aria-hidden="true"></div>
  <div class="patlama-katmani" id="patlamaKatmani" aria-hidden="true"></div>

  <main class="uygulama">

    <section class="ekran aktif" id="soruEkrani" aria-labelledby="soruBaslik">
      <div class="kart">
        <div class="hero-medya" id="heroMedya">
          <img class="hero-gif" id="heroGif" src="assets/gifs/hero.gif" alt="Kalp uzatan sevimli bir karakter">
          <div class="medya-yedek" aria-hidden="true">
            <svg class="kalp-svg" viewBox="0 0 32 30" focusable="false" aria-hidden="true">
              <defs>
                <linearGradient id="kalpGradyan" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#FF4F87"></stop>
                  <stop offset="100%" stop-color="#E63964"></stop>
                </linearGradient>
              </defs>
              <path d="M16 29.5C13.7 27.4 2 19.1 2 10.6 2 5.7 5.8 2 10.4 2c2.4 0 4.6 1.2 5.6 3.1C17 3.2 19.2 2 21.6 2 26.2 2 30 5.7 30 10.6c0 8.5-11.7 16.8-14 18.9z" fill="url(#kalpGradyan)"></path>
            </svg>
            <span class="yedek-parilti yedek-parilti-1" aria-hidden="true">✨</span>
            <span class="yedek-parilti yedek-parilti-2" aria-hidden="true">💫</span>
          </div>
        </div>

        <h1 class="baslik" id="soruBaslik" tabindex="-1">❤️ Sana küçük bir sorum var... ❤️</h1>
        <p class="soru">Beni seviyor musun?</p>

        <div class="buton-alani" id="butonAlani">
          <button type="button" class="btn btn-evet" id="evetBtn">Evet ❤️</button>
          <button type="button" class="btn btn-hayir" id="hayirBtn">Hayır 🙈</button>
        </div>

        <p class="mesaj" id="hayirMesaji" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="ekran" id="albumEkrani" aria-labelledby="albumBaslik" hidden>
      <div class="kart kart-genis">
        <button type="button" class="btn-geri btn-geri-ust" id="soruyaDonBtn">← Geri Dön</button>
        <h2 class="bolum-basligi" id="albumBaslik" tabindex="-1" data-odak>Birlikte biriktirdiğimiz güzel anılar... 💗</h2>
        <p class="alt-aciklama">Birini seç, birlikte hatırlayalım.</p>
        <div class="album-izgara" id="albumIzgara"></div>
      </div>
    </section>

    <section class="ekran" id="galeriEkrani" aria-labelledby="galeriBaslik" hidden>
      <div class="kart kart-genis">
        <div class="galeri-ust">
          <button type="button" class="btn-geri" id="albumlereDonBtn">← Geri Dön</button>
          <h2 class="bolum-basligi" id="galeriBaslik" tabindex="-1" data-odak></h2>
        </div>
        <div class="foto-izgara" id="fotoIzgara"></div>
      </div>
    </section>

  </main>

  <audio id="arkaPlanMuzigi" loop preload="none">
    <source src="assets/music/wanna-be-yours.mp3" type="audio/mpeg">
  </audio>
  <button type="button" class="muzik-dugmesi" id="muzikDugmesi" aria-pressed="false">♫ Müziği başlat</button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Büyük fotoğraf görünümü" hidden>
    <button type="button" class="lb-kapat" id="lbKapat" aria-label="Galeriye dön (kapat)">✕</button>
    <div class="lightbox-icerik">
      <img class="buyuk-gorsel" id="buyukGorsel" alt="">
      <div class="buyuk-yedek" id="buyukYedek" hidden>
        <span class="buyuk-yedek-kalp" aria-hidden="true">💗</span>
        <p>Bu fotoğraf henüz eklenmemiş.</p>
        <span class="buyuk-yedek-ad" id="buyukYedekAd"></span>
      </div>
      <p class="lb-bilgi"><span id="lbAlbumAdi"></span> · <span id="lbSayac" aria-live="polite"></span></p>
    </div>
    <button type="button" class="lb-ok lb-onceki" id="lbOnceki" aria-label="Önceki fotoğraf">‹</button>
    <button type="button" class="lb-ok lb-sonraki" id="lbSonraki" aria-label="Sonraki fotoğraf">›</button>
  </div>

  <script src="js/script.js"></script>
  <script>
    (() => {
      const muzik = document.getElementById("arkaPlanMuzigi");
      const dugme = document.getElementById("muzikDugmesi");

      function dugmeyiGuncelle(caliyor) {
        dugme.textContent = caliyor ? "Ⅱ Müziği durdur" : "♫ Müziği başlat";
        dugme.setAttribute("aria-pressed", String(caliyor));
      }

      async function muzikBaslat() {
        try {
          await muzik.play();
          dugmeyiGuncelle(true);
        } catch {
          dugmeyiGuncelle(false);
        }
      }

      dugme.addEventListener("click", async () => {
        if (muzik.paused) {
          await muzikBaslat();
        } else {
          muzik.pause();
          dugmeyiGuncelle(false);
        }
      });

      muzik.addEventListener("ended", () => dugmeyiGuncelle(false));
      muzik.addEventListener("error", () => {
        dugme.textContent = "♫ Şarkı dosyasını ekle";
        dugme.title = "assets/music/wanna-be-yours.mp3 dosyasını GitHub'a ekle";
      });

      // Tarayıcı izin verirse otomatik başlatmayı dener; engellenirse kullanıcı düğmeye basabilir.
      muzikBaslat();
    })();
  </script>
</body>
</html>
